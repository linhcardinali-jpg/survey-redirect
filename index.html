<!DOCTYPE html>
<html>
  <head>
    <title>Survey</title>
  </head>
  <body style="display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif;">
    <div style="text-align:center;">
      <p style="font-size:18px; margin-bottom:20px;">Tap below to go to the survey!</p>
      <a id="surveyBtn" href="#" 
        style="background:#405DE6; color:white; padding:16px 32px; border-radius:25px; text-decoration:none; font-size:16px;">
        Take the Survey
      </a>
    </div>
    <script>
      var forms = [
        "https://docs.google.com/forms/d/e/1FAIpQLSeOAPnkNwr-UFT7ETrh6pY3owyXJO9-TFWgncExl8b5M-l5JQ/viewform?usp=header",
        "https://docs.google.com/forms/d/e/1FAIpQLSdhqNOuFs3HkCz6X8etKD4G9iYxPXTRwB5GSfh5p_MrsGXMXw/viewform?usp=header",
        "https://docs.google.com/forms/d/e/1FAIpQLSfp6CXTZ2u6v0iBtMTr4ku0nMVytloK7t9UqikQrBXdBMm0GQ/viewform?usp=header",
        "https://docs.google.com/forms/d/e/1FAIpQLSd_dlEsIt4DDrBka6ZR8isFXpwbX7xstGcEIz1mHG9jrf0pVw/viewform?usp=header"
      ];
      var random = forms[Math.floor(Math.random() * forms.length)];
      document.getElementById("surveyBtn").href = random;
    </script>
  </body>
</html>
